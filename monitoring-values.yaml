grafana:
  adminPassword: "admin"
  service:
    type: NodePort
    nodePort: 31586
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 150m
      memory: 256Mi
  livenessProbe:
    initialDelaySeconds: 60
    timeoutSeconds: 5
    failureThreshold: 10
  readinessProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5


prometheus:
  prometheusSpec:
    retention: 2d
    resources:
      limits:
        cpu: 500m
        memory: 1024Mi
      requests:
        cpu: 200m
        memory: 512Mi

alertmanager:
  enabled: false


      
