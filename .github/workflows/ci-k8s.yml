name: CI - Build and Push Images

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/**'
      - 'cluster-config/**'
      - 'docs/**'
      - 'README.md'
      - '.gitignore'
      - '.trivyignore'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code 
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub 
        if: vars.DEPLOY_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Commit Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hunarguru-backend:${{ steps.vars.outputs.sha_short }}
      - name: Run Trivy scan on Backend
        uses: aquasecurity/trivy-action@master
        with: 
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/hunarguru-backend:${{ steps.vars.outputs.sha_short }} 
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'


      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hunarguru-frontend:${{ steps.vars.outputs.sha_short }}
      

      - name: Run Trivy Scan for frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/hunarguru-frontend:${{ steps.vars.outputs.sha_short }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true 
          severity: 'CRITICAL'

      - name: Push Backed Image
        if: vars.DEPLOY_ENABLED == 'true'
        uses: docker/build-push-action@v5
        with: 
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hunarguru-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hunarguru-frontend:${{ steps.vars.outputs.sha_short }}

